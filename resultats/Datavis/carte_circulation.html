<style>
  body { margin:0; font-family:Georgia,serif; }
  #map { height:100vh; }
  .panneau { position:absolute; top:12px; left:50px; z-index:1000; background:rgba(255,255,255,.94);
    padding:14px 18px; border-radius:6px; box-shadow:0 1px 6px rgba(0,0,0,.3); max-width:320px; }
  .panneau h1 { font-size:16px; margin:0 0 6px; color:#5a3e2b; }
  .panneau p { font-size:12px; margin:3px 0; color:#555; }
  #annee { font-size:26px; font-weight:bold; color:#5a3e2b; }
  #slider { width:100%; margin-top:8px; }
  .commandes { display:flex; align-items:center; gap:10px; margin:6px 0; }
  .vitesse { display:flex; align-items:center; gap:6px; font-size:11px; color:#555; }
  .vitesse input { width:80px; vertical-align:middle; }
  .legende { margin-top:10px; font-size:11px; }
  .legende .rubrique { font-weight:bold; color:#5a3e2b; margin-top:8px; }
  .legende .note { color:#777; font-style:italic; margin:3px 0; }
  .legende div.item { margin:2px 0; }
  .legende span.puce { display:inline-block; width:22px; height:3px; vertical-align:middle; margin-right:6px; }
  .legende span.pointille { border-top:2px dashed #6d4c41; background:none; height:0; }
  button { background:#5a3e2b; color:#fff; border:none; padding:6px 14px; border-radius:4px;
    cursor:pointer; font-family:Georgia,serif; }
  #btnLecture { min-width:92px; }

  /* Infobulles : thème parchemin cohérent avec le panneau */
  .leaflet-tooltip { font-family:Georgia,serif; font-size:12px; background:#fffaf0;
    border:1px solid #5a3e2b; color:#3e2c23; padding:4px 9px; box-shadow:0 1px 5px rgba(0,0,0,.3); }
  .leaflet-tooltip-top:before { border-top-color:#5a3e2b; }
  .leaflet-tooltip-bottom:before { border-bottom-color:#5a3e2b; }

  .leaflet-popup-content { font-family:Georgia,serif; font-size:12px; max-height:280px; overflow-y:auto; }
  .leaflet-popup-content h3 { margin:0 0 6px; color:#5a3e2b; font-size:14px; }
  .ed { border-bottom:1px solid #eee; padding:4px 0; }
  .ed a { color:#1565c0; text-decoration:none; }
  /* Éditeur / graveur : deux teintes sourdes et proches en luminosité (même famille que le
     thème parchemin), juste assez différenciées pour distinguer les deux rôles au survol
     sans attirer l'oeil comme le ferait une couleur vive. */
  .ed .editeur { color:#8a6d3b; }
  .ed .graveur { color:#4a6c73; }

  /* Marqueurs de ville : rebond léger quand leur taille change */
  .marqueur-ville { transition: r .5s cubic-bezier(.34,1.56,.64,1); }

  /* Flèches (halo + trait) : fondu à l'apparition */
  .flux-anim { transition: opacity .5s ease-out; }
  /* Flèches de copie : pointillés "fourmis en marche" */
  .flux-copie { animation: pointille-anime 1s linear infinite; }
  @keyframes pointille-anime { to { stroke-dashoffset: -20; } }
  /* Flèches de circulation : léger relief façon gravure */
  .flux-circulation { filter: drop-shadow(0 0 1px rgba(0,0,0,.35)); }

": "Venise", "dest": "Lyon", "an_orig": 1584, "an_dest": 1628, "titre_copie": "Les Metamorphoses d´Ovide de nouveau traduites en françois", "c1": [45.4408, 12.3155], "c2": [45.764, 4.8357], "courbure": 0.24}, {"graveur": "Franco, Giacomo", "origine": "Venise", "dest": "Paris", "an_orig": 1584, "an_dest": 1606, "titre_copie": "Les Metamorphoses d´Ovide de nouveau traduites en françois", "c1": [45.4408, 12.3155], "c2": [48.8566, 2.3522], "courbure": 0.12}, {"graveur": "Franco, Giacomo", "origine": "Venise", "dest": "Paris", "an_orig": 1584, "an_dest": 1610, "titre_copie": "Les Metamorphoses d´Ovide de nouveau traduites en françois", "c1": [45.4408, 12.3155], "c2": [48.8566, 2.3522], "courbure": -0.12}, {"graveur": "Tempesta, Antonio", "origine": "Amsterdam", "dest": "Paris", "an_orig": 1610, "an_dest": 1619, "titre_copie": "Les Metamorphoses d´Ovide de nouveau traduites en françois", "c1": [52.3676, 4.9041], "c2": [48.8566, 2.3522], "courbure": -0.12}, {"graveur": "Borcht, Peter van der", "origine": "Anvers", "dest": "Paris", "an_orig": 1591, "an_dest": 1619, "titre_copie": "Les Metamorphoses d´Ovide de nouveau traduites en françois", "c1": [51.2194, 4.4025], "c2": [48.8566, 2.3522], "courbure": -0.12}, {"graveur": "Franco, Giacomo", "origine": "Venise", "dest": "Paris", "an_orig": 1584, "an_dest": 1637, "titre_copie": "Pub. Ovidii Nasonis Metamorphose@n libri XV", "c1": [45.4408, 12.3155], "c2": [48.8566, 2.3522], "courbure": 0.24}, {"graveur": "Tempesta, Antonio", "origine": "Amsterdam", "dest": "Paris", "an_orig": 1610, "an_dest": 1660, "titre_copie": "Les Metamorphoses d'Ovide... par Du Ryer", "c1": [52.3676, 4.9041], "c2": [48.8566, 2.3522], "courbure": 0.12}, {"graveur": "Salomon, Bernard", "origine": "Lyon", "dest": "Rouen", "an_orig": 1584, "an_dest": 1608, "titre_copie": "Olympe des histoires poétiques", "c1": [45.764, 4.8357], "c2": [49.4432, 1.0993], "courbure": -0.12}, {"graveur": "Briot, Isaac", "origine": "Lyon", "dest": "Rouen", "an_orig": 1628, "an_dest": 1651, "titre_copie": "Les Metamorphoses d´Ovide de nouveau traduites en françois", "c1": [45.764, 4.8357], "c2": [49.4432, 1.0993], "courbure": 0.12}, {"graveur": "Anonyme1563", "origine": "Venise", "dest": "Venise", "an_orig": 1571, "an_dest": 1572, "titre_copie": "Le Metamorfosi di Ovidio", "c1": [45.4408, 12.3155], "c2": [45.4408, 12.3155], "courbure": 0.12}, {"graveur": "Anonyme1572", "origine": "Venise", "dest": "Venise", "an_orig": 1572, "an_dest": 1579, "titre_copie": "Le Metamorfosi di Ovidio", "c1": [45.4408, 12.3155], "c2": [45.4408, 12.3155], "courbure": -0.12}, {"graveur": "Anonyme1563", "origine": "Venise", "dest": "Venise", "an_orig": 1575, "an_dest": 1582, "titre_copie": "Le Metamorfosi di Ovidio", "c1": [45.4408, 12.3155], "c2": [45.4408, 12.3155], "courbure": 0.24}, {"graveur": "Anonyme1572", "origine": "Venise", "dest": "Venise", "an_orig": 1572, "an_dest": 1582, "titre_copie": "Le Metamorfosi di Ovidio", "c1": [45.4408, 12.3155], "c2": [45.4408, 12.3155], "courbure": -0.24}, {"graveur": "Anonyme1579", "origine": "Venise", "dest": "Venise", "an_orig": 1579, "an_dest": 1582, "titre_copie": "Le Metamorfosi di Ovidio", "c1": [45.4408, 12.3155], "c2": [45.4408, 12.3155], "courbure": 0.36}, {"graveur": "Franco, Giacomo", "origine": "Venise", "dest": "Venise", "an_orig": 1584, "an_dest": 1592, "titre_copie": "Le Metamorfosi di Ovidio", "c1": [45.4408, 12.3155], "c2": [45.4408, 12.3155], "courbure": -0.36}];

  // --- Légende (construite une seule fois : elle ne dépend pas de l'année) ---
  let lg = '<div class="rubrique">Villes</div>';
  lg += '<div class="note">Taille du point ∝ racine du nombre d\'éditions connues à cette date</div>';
  lg += '<div class="rubrique">Graveurs qui circulent</div>';
  for (const [g,c] of Object.entries(couleurs))
    lg += '<div class="item"><span class="puce" style="background:'+c+'"></span>'+g+'</div>';
  lg += '<div class="rubrique">Copies</div>';
  lg += '<div class="item"><span class="puce pointille"></span>édition → graveur qu\'elle copie</div>';
  document.getElementById('legende').innerHTML = lg;

  const map = L.map('map').setView([48.5,7],5);

  // Fond de carte historique (OpenHistoricalMap, frontières/toponymes d'époque),
  // filtré par date pour suivre le slider.
  const fondHistorique = L.maplibreGL({
    style: 'https://www.openhistoricalmap.org/map-styles/main/main.json',
    attribution: '© OpenHistoricalMap contributors'
  }).addTo(map);
  const carteHistorique = fondHistorique.getMaplibreMap();

  function filtrerParDate(annee) {
    try {
      if (carteHistorique.isStyleLoaded && carteHistorique.isStyleLoaded() && carteHistorique.filterByDate) {
        carteHistorique.filterByDate(String(annee));
      }
    } catch (err) { /* style pas encore prêt, on réessaiera au prochain dessiner() */ }
  }
  carteHistorique.on('load', () => filtrerParDate(+document.getElementById('slider').value));

  // --- Petit arc entre deux points, pour des flèches courbes plutôt que des segments droits.
  // `courbure` détermine de quel côté et de combien l'arc dévie du segment droit : c'est ce
  // qui permet à deux flèches reliant la même paire de villes de ne pas se superposer
  // (courbure différente calculée en Python, voir section 4).
  // Cas particulier : c1 et c2 identiques (flèche de copie au sein d'une même ville) — la
  // direction perpendiculaire n'est alors pas calculable (dx=dy=0), donc on retombe sur une
  // direction fixe et une longueur de référence, pour obtenir une petite boucle visible
  // plutôt qu'un point invisible. ---
  function pointsArc(c1, c2, courbure) {
    const [lat1, lon1] = c1, [lat2, lon2] = c2;
    const dx = lon2 - lon1, dy = lat2 - lat1;
    const longueur = Math.sqrt(dx*dx + dy*dy);
    const boucle = longueur < 1e-6;
    const px = boucle ? 1 : dy / longueur, py = boucle ? 0 : -dx / longueur;  // perpendiculaire unitaire
    const l = boucle ? 0.18 : longueur;  // longueur de référence (fixe pour une boucle)
    const cx = (lon1 + lon2) / 2 + px * l * courbure;
    const cy = (lat1 + lat2) / 2 + py * l * courbure;
    const pts = [];
    const n = 24;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const lat = (1-t)*(1-t)*lat1 + 2*(1-t)*t*cy + t*t*lat2;
      const lon = (1-t)*(1-t)*lon1 + 2*(1-t)*t*cx + t*t*lon2;
      pts.push([lat, lon]);
    }
    return pts;
  }

  // Trace une flèche courbe avec halo + zone de survol élargie + infobulle + pointe (de c1 vers
  // c2 : la pointe indique c2), et la fait apparaître en fondu.
  // options: {couleur, poids, pointille (bool), classe}
  function tracerFleche(c1, c2, courbure, infobulle, options) {
    const pts = pointsArc(c1, c2, courbure);
    const calques = [];
    const cibles = [];  // opacité finale de chaque calque animable, pour le fondu d'entrée

    const opaciteHalo = .55;
    const halo = L.polyline(pts, {
      color:'#fff', weight: options.poids + 3, opacity: 0, interactive:false, className:'flux-anim'
    }).addTo(map);
    calques.push(halo); cibles.push(opaciteHalo);

    const opaciteTrait = .85;
    const styleTrait = {
      color: options.couleur, weight: options.poids, opacity: 0, interactive:false,
      className: 'flux-anim ' + options.classe
    };
    if (options.pointille) styleTrait.dashArray = '4,7';
    const trait = L.polyline(pts, styleTrait).addTo(map);
    calques.push(trait); cibles.push(opaciteTrait);

    const deco = L.polylineDecorator(trait, {
      patterns: [{
        offset:'60%', repeat:0,
        symbol: L.Symbol.arrowHead({
          pixelSize: options.pointille ? 9 : 12,
          pathOptions: {color: options.couleur, fillOpacity:.9, weight:0}
        })
      }]
    }).addTo(map);
    calques.push(deco); cibles.push(undefined);  // pas de fondu sur la pointe (calque composite)

    // Zone de survol invisible et large : plus facile à cibler qu'un trait fin.
    const zoneSurvol = L.polyline(pts, {opacity:0, weight:16}).addTo(map);
    zoneSurvol.bindTooltip(infobulle, {sticky:true});
    calques.push(zoneSurvol); cibles.push(undefined);  // reste invisible : pas de fondu à faire

    // Déclenche le fondu au prochain "tick" (sinon le navigateur ne voit pas la transition
    // depuis opacity:0, puisque l'élément vient d'être créé avec cette valeur).
    setTimeout(() => {
      calques.forEach((c, i) => { if (cibles[i] !== undefined) c.setStyle({opacity: cibles[i]}); });
    }, 20);

    return calques;
  }

  // --- Marqueurs de ville : mis à jour en place (pas détruits/recréés) pour permettre
  // une transition CSS douce sur leur taille (voir .marqueur-ville) ---
  let mVilles = {};
  // --- Flèches : ajoutées/retirées seulement quand nécessaire (pas à chaque frame),
  // pour permettre une apparition en fondu plutôt qu'un pop-in répété ---
  let mFlechesActives = {}, mFlechesCopiesActives = {};

  function majFlechesActives(liste, actives, annee, construire) {
    const voulues = new Set();
    liste.forEach((f, i) => {
      if (f.an_dest > annee) return;
      voulues.add(i);
      if (!actives[i]) actives[i] = construire(f);
    });
    for (const cle of Object.keys(actives)) {
      if (!voulues.has(+cle)) {
        actives[cle].forEach(c => map.removeLayer(c));
        delete actives[cle];
      }
    }
  }

  function dessiner(annee) {
    document.getElementById('annee').textContent = annee;
    filtrerParDate(annee);

    for (const [ville,d] of Object.entries(villes)) {
      const editionsVisibles = d.editions.filter(e => e.an !== null && e.an <= annee);
      const n = editionsVisibles.length;
      if (n === 0) {
        if (mVilles[ville]) { map.removeLayer(mVilles[ville]); delete mVilles[ville]; }
        continue;
      }
      const rayon = 6 + Math.sqrt(n) * 4;
      let html = '<h3>'+ville+' ('+n+' édition(s) jusqu\'en '+annee+')</h3>';
      editionsVisibles.slice().sort((a,b)=>b.an-a.an).forEach(e=>{
        // Titre en ligne principale, puis une ligne de métadonnées groupées
        // (éditeur d'abord, s'il est renseigné, puis graveur et technique), chacun dans une
        // teinte différente (voir .ed .editeur / .ed .graveur) pour les distinguer d'un
        // coup d'oeil sans que ça saute aux yeux.
        html += '<div class="ed"><b>'+e.annee+'</b> — '+e.titre+'<br><i>';
        if (e.editeur) html += '<span class="editeur">'+e.editeur+'</span> · ';
        html += '<span class="graveur">'+e.graveur+'</span> · '+e.technique+'</i>';
        if (e.lien) html += '<br><a href="'+e.lien+'" target="_blank">→ voir</a>';
        html += '</div>';
      });
      if (mVilles[ville]) {
        mVilles[ville].setRadius(rayon);
        mVilles[ville].setPopupContent(html);
      } else {
        mVilles[ville] = L.circleMarker([d.lat,d.lon], {
          radius: rayon, fillColor:'#5a3e2b', color:'#fff', weight:2, fillOpacity:.8,
          className: 'marqueur-ville'
        }).addTo(map).bindPopup(html, {maxWidth:320});
      }
    }

    majFlechesActives(fleches, mFlechesActives, annee, f => tracerFleche(
      f.c1, f.c2, f.courbure,
      f.graveur+' : '+f.origine+' ('+f.an_orig+') → '+f.dest+' ('+f.an_dest+')',
      {couleur: f.couleur, poids: 2.5, pointille: false, classe: 'flux-circulation'}
    ));

    // Flèches de copie tracées en sens inverse des flèches de circulation : de l'édition
    // copieuse (f.dest, plus récente) vers l'édition/graveur qu'elle copie (f.origine, plus
    // ancienne) — la pointe montre "ce que copie cette édition", pas un déplacement dans le
    // temps comme pour les flèches de circulation.
    majFlechesActives(flechesCopies, mFlechesCopiesActives, annee, f => tracerFleche(
      f.c2, f.c1, f.courbure,
      '« '+f.titre_copie+' » — '+f.dest+' ('+f.an_dest+') copie '+f.graveur+', '+f.origine+' ('+f.an_orig+')',
      {couleur: '#6d4c41', poids: 1.75, pointille: true, classe: 'flux-copie'}
    ));
  }

  const slider=document.getElementById('slider');
  slider.addEventListener('input',e=>dessiner(+e.target.value));

  // --- Lecture : un seul bouton bascule ▶/⏸, vitesse réglable par curseur ---
  const btnLecture = document.getElementById('btnLecture');
  const curseurVitesse = document.getElementById('vitesse');
  const libelleVitesse = document.getElementById('vitesseLabel');
  const INTERVALLES_MS = [400, 220, 120, 60];  // du curseur 1 (lente) au curseur 4 (très rapide)
  const NOMS_VITESSE = ['Lente', 'Normale', 'Rapide', 'Très rapide'];

  function majLibelleVitesse() {
    libelleVitesse.textContent = NOMS_VITESSE[+curseurVitesse.value - 1];
  }
  majLibelleVitesse();

  let timer = null;
  function play() {
    let a = +slider.value >= 1750 ? 1490 : +slider.value;
    timer = setInterval(() => {
      a += 2; if (a > 1750) { a = 1750; pause(); return; }
      slider.value = a; dessiner(a);
    }, INTERVALLES_MS[+curseurVitesse.value - 1]);
    btnLecture.textContent = '⏸ Pause';
  }
  function pause() {
    if (timer) { clearInterval(timer); timer = null; }
    btnLecture.textContent = '▶ Animer';
  }
  function basculerLecture() { timer ? pause() : play(); }
  function tout() { pause(); slider.value = 1750; dessiner(1750); }

  curseurVitesse.addEventListener('input', () => {
    majLibelleVitesse();
    if (timer) { pause(); play(); }  // relance immédiatement à la nouvelle vitesse
  });

  dessiner(1750);
</script></body></html>
