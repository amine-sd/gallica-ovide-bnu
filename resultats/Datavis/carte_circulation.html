      if (mVilles[ville]) { map.removeLayer(mVilles[ville]); delete mVilles[ville]; }
      if (n > 0) {
        let html = '<h3>'+ville+' ('+n+' édition(s) jusqu\'en '+annee+')</h3>';
        d.editions.filter(e=>e.an!==null && e.an<=annee).forEach(e=>{
          html += '<div class="ed"><b>'+e.annee+'</b> — '+e.titre+
                  '<br><i>'+e.graveur+' · '+e.technique+'</i>';
          if (e.lien) html += '<br><a href="'+e.lien+'" target="_blank">→ voir</a>';
          html += '</div>';
        });
        mVilles[ville] = L.circleMarker([d.lat,d.lon], {
          radius:6+Math.sqrt(n)*4, fillColor:'#5a3e2b', color:'#fff', weight:2, fillOpacity:.8
        }).addTo(map).bindPopup(html,{maxWidth:320});
      }
    }
    mFleches.forEach(f => map.removeLayer(f)); mFleches = [];
    fleches.filter(f => f.an_dest <= annee).forEach(f => {
      const poly = L.polyline([f.c1,f.c2], {color:f.couleur,weight:2.5,opacity:.75}).addTo(map);
      poly.bindTooltip(f.graveur+' : '+f.origine+' → '+f.dest+' ('+f.an_dest+')',{sticky:true});
      const deco = L.polylineDecorator(poly, {
        patterns: [{
          offset:'60%', repeat:0,
          symbol: L.Symbol.arrowHead({pixelSize:12, pathOptions:{color:f.couleur, fillOpacity:.9, weight:0}})
        }]
      }).addTo(map);
      mFleches.push(poly, deco);
    });
  }

  const slider=document.getElementById('slider');
  slider.addEventListener('input',e=>dessiner(+e.target.value));
  let timer=null;
  function play() { pause(); let a=+slider.value>=1750?1490:+slider.value;
    timer=setInterval(()=>{ a+=2; if(a>1750){a=1750;pause();} slider.value=a; dessiner(a); },120); }
  function pause() { if(timer){clearInterval(timer);timer=null;} }
  function tout() { pause(); slider.value=1750; dessiner(1750); }
  dessiner(1750);
</script></body></html>
